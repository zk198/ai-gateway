services:
  ai-gateway:
    build: .
    environment:
      RAG_INGESTION_URL: http://pst-agent:8000
      RAG_RETRIEVAL_URL: http://rag-retrieval:8100
      AI_AGENT_URL: http://agent-core:8000
      AI_POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?set RAG_JWT_SECRET}
      LAYA_ENABLED: ${LAYA_ENABLED:-false}
      LAYA_URL: ${LAYA_URL:-http://laya:8000}
      LAYA_TIMEOUT_SECONDS: ${LAYA_TIMEOUT_SECONDS:-5}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AI_GATEWAY_PORT:-8200}:8200"
